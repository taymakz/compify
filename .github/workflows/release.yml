name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New version (e.g. 0.2.0). Leave empty to use current Cargo.toml version.'
        required: false
        type: string
      draft:
        description: 'Publish as draft release'
        required: false
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# ── 1. Bump versions in every file and push a "release" commit ──────────────────
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - id: ver
        shell: bash
        run: |
          INPUT="${{ inputs.version }}"
          if [ -n "$INPUT" ]; then
            echo "version=$INPUT" >> "$GITHUB_OUTPUT"
          else
            VER=$(grep -m1 '^version' src-tauri/Cargo.toml | sed 's/version = "\(.*\)"/\1/')
            echo "version=$VER" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version in all files
        shell: bash
        run: |
          V="${{ steps.ver.outputs.version }}"
          echo "Bumping to $V"

          sed -i "0,/^version = \"[^\"]*\"/{s/^version = \"[^\"]*\"/version = \"$V\"/}" \
            src-tauri/Cargo.toml
          sed -i "0,/^version = \"[^\"]*\"/{s/^version = \"[^\"]*\"/version = \"$V\"/}" \
            installer/src-tauri/Cargo.toml

          jq --arg v "$V" '.version = $v' src-tauri/tauri.conf.json \
            > /tmp/t.json && mv /tmp/t.json src-tauri/tauri.conf.json
          jq --arg v "$V" '.version = $v' installer/src-tauri/tauri.conf.json \
            > /tmp/t.json && mv /tmp/t.json installer/src-tauri/tauri.conf.json

          jq --arg v "$V" '.version = $v' package.json \
            > /tmp/t.json && mv /tmp/t.json package.json
          jq --arg v "$V" '.version = $v' installer/package.json \
            > /tmp/t.json && mv /tmp/t.json installer/package.json

      - name: Commit version bump and tag
        shell: bash
        run: |
          V="${{ steps.ver.outputs.version }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add \
            src-tauri/Cargo.toml \
            installer/src-tauri/Cargo.toml \
            src-tauri/tauri.conf.json \
            installer/src-tauri/tauri.conf.json \
            package.json \
            installer/package.json

          if ! git diff --cached --quiet; then
            git commit -m "chore: release v${V}"
            git push
          fi

          git tag -f "v${V}"
          git push origin "v${V}" --force

# ── 2. Windows ──────────────────────────────────────────────────────────────────
  build-windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.prepare.outputs.version }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install frontend deps
        run: pnpm install

      - name: Build main app
        run: pnpm tauri build --no-bundle

      - name: Prepare installer resources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "installer\src-tauri\resources" | Out-Null
          New-Item -ItemType Directory -Force "installer\src\assets" | Out-Null
          Copy-Item "$env:CARGO_TARGET_DIR\release\tauri-starter.exe" `
            "installer\src-tauri\resources\Compify.exe" -Force
          Copy-Item "src\assets\logo-128.png" `
            "installer\src\assets\logo-128.png" -Force

      - name: Install installer frontend deps
        working-directory: installer
        run: pnpm install

      - name: Build installer app
        working-directory: installer
        run: pnpm tauri build --no-bundle

      # Use a staging/ dir — avoids collision with Vite's dist/ output
      - name: Collect Windows artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force staging | Out-Null
          $v = "${{ needs.prepare.outputs.version }}"
          Copy-Item "$env:CARGO_TARGET_DIR\release\compify-installer.exe" `
            "staging\Compify-$v-Setup-windows-x64.exe" -Force
          Copy-Item "$env:CARGO_TARGET_DIR\release\tauri-starter.exe" `
            "staging\Compify-$v-portable-windows-x64.exe" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: staging/

# ── 3. Linux ────────────────────────────────────────────────────────────────────
  build-linux:
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.prepare.outputs.version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            patchelf build-essential curl wget file

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install frontend deps
        run: pnpm install

      - name: Build Linux bundles + binary
        run: pnpm tauri build

      # Use staging/ — Vite's beforeBuildCommand already wrote to dist/
      - name: Collect Linux artifacts
        run: |
          mkdir -p staging
          v="${{ needs.prepare.outputs.version }}"
          find "$CARGO_TARGET_DIR/release/bundle/appimage" -name "*.AppImage" \
            -exec cp {} "staging/Compify-${v}-linux-x86_64.AppImage" \; 2>/dev/null || true
          find "$CARGO_TARGET_DIR/release/bundle/deb" -name "*.deb" \
            -exec cp {} "staging/Compify-${v}-linux-amd64.deb" \; 2>/dev/null || true
          cp "$CARGO_TARGET_DIR/release/tauri-starter" \
            "staging/Compify-${v}-portable-linux-x86_64"
          chmod +x "staging/Compify-${v}-portable-linux-x86_64"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: staging/

# ── 4. macOS ─────────────────────────────────────────────────────────────────────
  build-macos:
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.prepare.outputs.version }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install frontend deps
        run: pnpm install

      - name: Build macOS universal (dmg + app bundle)
        run: pnpm tauri build --target universal-apple-darwin

      # Use staging/ — Vite's beforeBuildCommand already wrote to dist/
      - name: Collect macOS artifacts
        run: |
          mkdir -p staging
          v="${{ needs.prepare.outputs.version }}"
          base="$CARGO_TARGET_DIR/universal-apple-darwin/release/bundle"
          find "$base/dmg" -name "*.dmg" \
            -exec cp {} "staging/Compify-${v}-macos-universal.dmg" \; 2>/dev/null || true
          find "$base/macos" -maxdepth 1 -name "*.app" -print0 \
            | xargs -0 -I{} zip -r "staging/Compify-${v}-portable-macos-universal.zip" {}

      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: staging/

# ── 5. Create GitHub Release ─────────────────────────────────────────────────────
  release:
    needs: [prepare, build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: staging
          merge-multiple: true

      - name: List release files
        run: ls -lh staging/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: Compify v${{ needs.prepare.outputs.version }}
          draft: ${{ inputs.draft }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: staging/**
